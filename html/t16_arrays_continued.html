<!DOCTYPE html>
<html lang="en">

<head>
  <title>T16-arrays continued</title>
  <meta charset="UTF-8">

<body>
  <h1>T16-arrays continued</h1>
  <p>Open the console <code>(Ctrl-shift-i)</code> to see the messages.</p>

    <button onClick="start()">START</button>

  <form onsubmit="return false;">
    <label for="formAge">Age:</label><br>
    <input type="number" id="ageField" name="formAge"><br>
    <input type="submit" onClick=getFormInput()>
  </form>

  <form onsubmit="return false;">
    <label for="formMoney">Pocket Money:</label><br>
    <input type="number" id="moneyField" name="formMoney"><br>
    <input type="submit" onClick=getFormInput()>
  </form>

  <form onsubmit="return false;">
    <label for="formRating">How much do you like chocolate? (0-3)</label><br>
    <input type="number" id="ratingField" name="formRating"><br>
    <input type="submit" onClick=getFormInput()>
  </form>
  
  <form onsubmit="return false;">
    <label for="formShopping">Add an item to your shopping list:</label><br>
    <input type="text" id="shoppingField" name="formShopping"><br>
    <input type="submit" onClick=getShoppingInput()>
  </form>

  <div id="spaceForJavaScriptOutput">

    The output of your script will go here.

  </div>


  <script src="../t16_arrays_continued.js"></script>

</body>

</html>
